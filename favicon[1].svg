<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1a472a" rx="20"/>
  
  <!-- Shopping Bag (EH-Store کے لیے) -->
  <g transform="translate(50, 50)">
    <!-- Bag body -->
    <path d="M -25 -5 L -20 -20 Q -20 -25 -15 -25 L 15 -25 Q 20 -25 20 -20 L 25 -5 Q 25 0 20 5 L -20 5 Q -25 0 -25 -5 Z" 
          fill="#4CAF50" stroke="#fff" stroke-width="1.5"/>
    
    <!-- Handle -->
    <path d="M -15 -25 Q -15 -35 0 -35 Q 15 -35 15 -25" 
          fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Shopping cart details -->
    <circle cx="-8" cy="0" r="3" fill="#fff"/>
    <circle cx="8" cy="0" r="3" fill="#fff"/>
  </g>
</svg>